services:
  ota-server:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      OTA_WEBHOOK_TOKEN: "${OTA_WEBHOOK_TOKEN:?Set OTA_WEBHOOK_TOKEN in .env}"
      OTA_DATA_DIR: /data
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ota-firmware:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ota-firmware:
